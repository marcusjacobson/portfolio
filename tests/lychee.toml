# Lychee link checker config
# https://lychee.cli.rs/usage/config/

include_verbatim = true
max_concurrency = 8
max_retries = 2
retry_wait_time = 2
timeout = 20
accept = [200, 206, 301, 302, 304, 308, 403, 429]
exclude_path = [
    "node_modules",
    "playwright-report",
    "test-results",
    "staging-inbox",
    ".github/instructions",
    ".github/prompts",
    ".github/agents",
]
exclude = [
    # Local file references inside templates
    "^file://",
    # Localhost
    "^https?://localhost",
    "^https?://127\\.0\\.0\\.1",
    # Example placeholders
    "example\\.com",
    # User-scoped GitHub Projects (v2) require auth; lychee gets 404 unauthenticated
    "^https?://github\\.com/users/[^/]+/projects/",
    # Private lab repos referenced from project cards (lychee gets 404 unauthenticated)
    "^https?://github\\.com/marcusjacobson/Purview-as-Code-MarcusJ-Lab",
    "^https?://github\\.com/marcusjacobson/Entra-Deployments-Marcusj-Lab",
    # CHANGELOG.md on main — fresh files added in the same PR 404 until merge.
    "^https?://github\\.com/marcusjacobson/portfolio/blob/main/CHANGELOG\\.md",
    # Fresh agent/prompt files added in PR #184 (#183) — 404 until merged to main.
    "^https?://github\\.com/marcusjacobson/portfolio/blob/main/\\.github/agents/repo-cleanup\\.agent\\.md",
    "^https?://github\\.com/marcusjacobson/portfolio/blob/main/\\.github/prompts/repo-cleanup\\.prompt\\.md",
    # Fresh agent file added in PR #197 (#191) — 404 until merged to main.
    "^https?://github\\.com/marcusjacobson/portfolio/blob/main/\\.github/agents/triage\\.agent\\.md",
    # LICENSE added in PR #226 — 404 until merged to main.
    "^https?://github\\.com/marcusjacobson/portfolio/blob/main/LICENSE$",
    # AGENTS.md added in PR #232 — 404 until merged to main.
    "^https?://github\\.com/marcusjacobson/portfolio/blob/main/AGENTS\\.md$",
    # LinkedIn returns 404 to unauthenticated bots (intermittent). Public profile is verified manually.
    "^https?://(www\\.)?linkedin\\.com/in/",
]
