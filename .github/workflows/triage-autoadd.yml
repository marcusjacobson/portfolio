name: Triage auto-add to board

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: read

concurrency:
  group: triage-autoadd-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  add-to-project:
    name: Add needs-triage issue to Triage Queue
    runs-on: ubuntu-latest
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'needs-triage') ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'needs-triage'))
    steps:
      - name: Add issue to board #19
        uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/users/marcusjacobson/projects/19
          github-token: ${{ secrets.BUG_PROJECT_TOKEN }}
