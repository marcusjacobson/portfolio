name: Maturity Scout (weekly scan)

on:
  workflow_dispatch:
    inputs:
      max:
        description: "Max candidate issues to file in this run"
        required: false
        default: "5"
  schedule:
    # 14:00 UTC every Monday — outside business hours but visible in morning sweeps.
    - cron: "0 14 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: maturity-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Repo-hygiene maturity scan
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Classic PAT with `project` scope — used only for `gh project item-add`
      # so each step can attach its filed issues to board #15 inline. The
      # default GITHUB_TOKEN cannot write to user-owned Projects v2, and
      # issues it creates do not trigger downstream workflows like
      # maturity-autoadd.yml. See issue #133.
      PROJECT_TOKEN: ${{ secrets.BUG_PROJECT_TOKEN }}
      MAX_FILED: ${{ github.event.inputs.max || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Network egress assumptions: this job intentionally performs NO live
      # fetches against Microsoft Learn, GitHub docs, OWASP, or WCAG. Source
      # checks that need LLM judgment stay in the on-demand chat mode of
      # @maturity-scout. The unattended job only runs deterministic
      # repo-hygiene checks (file existence in this checkout) plus dedupe
      # queries against the GitHub API.

      - name: Run repo-hygiene checks and file gap issues
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          BOARD_URL="https://github.com/users/marcusjacobson/projects/15"
          MAX="${MAX_FILED}"

          # ---- Define checks: each entry is "key|path|title|body".
          # Bodies follow the four-section shape required by issue #110 AC5.
          declare -a CHECKS=()

          add_check () {
            CHECKS+=("$1")
          }

          # Issue body is rendered from an external template so the YAML
          # block scalar isn't broken by an inline heredoc (see issue #115).
          # Template lives at .github/workflows/templates/repo-hygiene-issue-body.md
          # and uses __PATH__ as the only placeholder. read_body takes the
          # path as $1 (the title argument is no longer needed because the
          # template references only the path).
          read_body () {
            sed "s|__PATH__|$1|g" .github/workflows/templates/repo-hygiene-issue-body.md
          }

          # path | title-suffix | label-area
          declare -a TARGETS=(
            "SECURITY.md|Add SECURITY.md so vulnerability reporting has a documented channel|area:docs"
            "CONTRIBUTING.md|Add CONTRIBUTING.md to document the intake + branch + PR workflow|area:docs"
            "CODEOWNERS|Add CODEOWNERS so reviews route automatically|area:workflow"
            ".github/ISSUE_TEMPLATE|Add issue templates so community filings match the four-section shape|area:workflow"
            ".github/PULL_REQUEST_TEMPLATE.md|Add a pull-request template aligned to the repo conventions|area:workflow"
            ".github/dependabot.yml|Enable Dependabot for Actions and any tracked manifests|area:workflow"
            "LICENSE|Add a LICENSE file so the portfolio's reuse terms are explicit|area:docs"
          )

          # ---- Pull existing issues + board items for dedupe.
          echo "::group::Fetch existing issues with source:* labels"
          EXISTING_ISSUES=$(gh issue list \
            --state all \
            --search 'in:title in:body label:source:repo-hygiene' \
            --json number,title,state,closedAt,url \
            --limit 200)
          echo "$EXISTING_ISSUES" | jq 'length as $n | "found \($n) issues"'
          echo "::endgroup::"

          echo "::group::Fetch board #15 items"
          BOARD_ITEMS=$(gh project item-list 15 \
            --owner marcusjacobson \
            --format json \
            --limit 200 || echo '{"items":[]}')
          echo "$BOARD_ITEMS" | jq '.items | length as $n | "found \($n) board items"'
          echo "::endgroup::"

          FILED=0
          SUPPRESSED=0
          SUMMARY_FILED=""
          SUMMARY_SUPPRESSED=""

          for entry in "${TARGETS[@]}"; do
            if [[ "$FILED" -ge "$MAX" ]]; then
              echo "Hit max ($MAX); stopping."
              break
            fi

            IFS='|' read -r CHECK_PATH TITLE AREA <<< "$entry"

            # Skip if the file/dir already exists in the checkout — no gap.
            if [[ -e "$CHECK_PATH" ]]; then
              echo "Present: $CHECK_PATH — skipping."
              continue
            fi

            # Dedupe: open or recently-closed (90d) issue mentioning this path?
            MATCH=$(echo "$EXISTING_ISSUES" | jq -r --arg p "$CHECK_PATH" \
              '[.[] | select(.title | test($p; "i"))] | .[0] // empty | "\(.number)|\(.url)|\(.state)"')
            if [[ -n "$MATCH" ]]; then
              SUPPRESSED=$((SUPPRESSED+1))
              SUMMARY_SUPPRESSED+=$'\n  - '"$CHECK_PATH"' — overlaps with '"$MATCH"
              echo "Dedup suppressed: $CHECK_PATH overlaps $MATCH"
              continue
            fi

            # Dedupe: board item with same path in title?
            BMATCH=$(echo "$BOARD_ITEMS" | jq -r --arg p "$CHECK_PATH" \
              '.items[]? | select(.title // "" | test($p; "i")) | .id' | head -n1)
            if [[ -n "$BMATCH" ]]; then
              SUPPRESSED=$((SUPPRESSED+1))
              SUMMARY_SUPPRESSED+=$'\n  - '"$CHECK_PATH"' — overlaps with board item '"$BMATCH"
              echo "Board-dedup suppressed: $CHECK_PATH overlaps $BMATCH"
              continue
            fi

            # Build body and file the issue.
            BODY=$(read_body "$CHECK_PATH")
            BODY_FILE=$(mktemp)
            printf '%s\n' "$BODY" > "$BODY_FILE"

            echo "Filing: $TITLE"
            URL=$(gh issue create \
              --title "$TITLE" \
              --label "needs-triage,source:repo-hygiene,$AREA" \
              --body-file "$BODY_FILE")
            rm -f "$BODY_FILE"

            FILED=$((FILED+1))
            SUMMARY_FILED+=$'\n  - '"$URL"' — '"$TITLE"

            # Attach to board #15 inline. Issues created via GITHUB_TOKEN
            # do not trigger the sibling `maturity-autoadd.yml` workflow
            # (GitHub anti-recursion). Use BUG_PROJECT_TOKEN here so the
            # board-attach is deterministic and same-run. See issue #133.
            GH_TOKEN="$PROJECT_TOKEN" gh project item-add 15 \
              --owner marcusjacobson --url "$URL" >/dev/null
          done

          {
            echo "## Maturity Scout — weekly scan"
            echo ""
            echo "Filed: $FILED"
            if [[ -n "$SUMMARY_FILED" ]]; then echo "$SUMMARY_FILED"; fi
            echo ""
            echo "Suppressed (dedupe): $SUPPRESSED"
            if [[ -n "$SUMMARY_SUPPRESSED" ]]; then echo "$SUMMARY_SUPPRESSED"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Hand the running tally to the next step so the github-docs
          # scan respects the same MAX cap.
          echo "filed=$FILED" >> "$GITHUB_OUTPUT"

      - name: Run github-docs checks (action SHA-pin audit) and file gap issue
        id: scan_github_docs
        shell: bash
        run: |
          set -euo pipefail

          MAX="${MAX_FILED}"
          FILED_SO_FAR="${{ steps.scan.outputs.filed }}"
          FILED_SO_FAR="${FILED_SO_FAR:-0}"

          if [[ "$FILED_SO_FAR" -ge "$MAX" ]]; then
            echo "Hit MAX ($MAX) in repo-hygiene step; skipping github-docs scan."
            {
              echo ""
              echo "## Maturity Scout — github-docs"
              echo ""
              echo "Skipped: MAX cap of $MAX reached by repo-hygiene step."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "filed_total=$FILED_SO_FAR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- Scan: action SHA-pin audit on .github/workflows/*.yml.
          # Convention (see .github/copilot-instructions.md): third-party
          # actions must be pinned to a 40-char commit SHA. Flag every
          # `uses:` line whose ref after `@` is not a 40-char hex SHA.
          # Skip local action references (`uses: ./...`) and reusable
          # workflow refs without a `@` (those are validated elsewhere).
          FINDINGS=""
          COUNT=0
          shopt -s nullglob
          for wf in .github/workflows/*.yml .github/workflows/*.yaml; do
            # Use grep -nE to capture line numbers; tolerate no matches.
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              LINENO_HIT="${line%%:*}"
              REST="${line#*:}"
              # Extract the value after `uses:` — strip leading whitespace
              # and the keyword itself.
              USES_VAL=$(echo "$REST" | sed -E 's/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*//; s/[[:space:]]*#.*$//; s/[[:space:]]*$//')
              # Skip local actions (start with ./ or ../).
              [[ "$USES_VAL" == ./* || "$USES_VAL" == ../* ]] && continue
              # Skip lines without an @ (e.g. reusable workflow refs).
              [[ "$USES_VAL" != *@* ]] && continue
              REF="${USES_VAL##*@}"
              # 40-char lowercase hex => SHA-pinned, OK.
              if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
                continue
              fi
              FINDINGS+=$'- `'"$wf"':'"$LINENO_HIT"'` — `'"$USES_VAL"'`'$'\n'
              COUNT=$((COUNT+1))
            done < <(grep -nE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^[:space:]]+' "$wf" || true)
          done
          shopt -u nullglob

          if [[ "$COUNT" -eq 0 ]]; then
            echo "No unpinned third-party action references found."
            {
              echo ""
              echo "## Maturity Scout — github-docs"
              echo ""
              echo "Filed: 0 (no unpinned action references found)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "filed_total=$FILED_SO_FAR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- Dedupe: open issue with the canonical title prefix and
          # the source:github-docs label?
          TITLE_PREFIX="Pin GitHub Actions to commit SHAs"
          EXISTING=$(gh issue list \
            --state open \
            --search "in:title \"$TITLE_PREFIX\" label:source:github-docs" \
            --json number,title,url \
            --limit 50)
          MATCH=$(echo "$EXISTING" | jq -r --arg p "$TITLE_PREFIX" \
            '[.[] | select(.title | startswith($p))] | .[0] // empty | "\(.number)|\(.url)"')
          if [[ -n "$MATCH" ]]; then
            echo "Dedup suppressed: existing open issue $MATCH"
            {
              echo ""
              echo "## Maturity Scout — github-docs"
              echo ""
              echo "Filed: 0"
              echo ""
              echo "Suppressed (dedupe): 1"
              echo "  - action SHA-pin audit — overlaps with $MATCH"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "filed_total=$FILED_SO_FAR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- Render body and file the consolidated issue.
          TITLE="${TITLE_PREFIX} in ${COUNT} workflow file(s)"
          BODY_FILE=$(mktemp)
          # Use bash parameter expansion for placeholder substitution to
          # avoid breaking the YAML block scalar with a heredoc (issue #115).
          TEMPLATE=$(cat .github/workflows/templates/github-docs-issue-body.md)
          TEMPLATE="${TEMPLATE//__COUNT__/$COUNT}"
          # Strip trailing newline from FINDINGS so the bullet list closes cleanly.
          FINDINGS_TRIMMED="${FINDINGS%$'\n'}"
          TEMPLATE="${TEMPLATE//__FINDINGS__/$FINDINGS_TRIMMED}"
          printf '%s\n' "$TEMPLATE" > "$BODY_FILE"

          echo "Filing: $TITLE"
          URL=$(gh issue create \
            --title "$TITLE" \
            --label "needs-triage,source:github-docs,area:workflow" \
            --body-file "$BODY_FILE")
          rm -f "$BODY_FILE"

          # Attach to board #15 inline (see issue #133 — GITHUB_TOKEN-created
          # issues don't trigger maturity-autoadd.yml).
          GH_TOKEN="$PROJECT_TOKEN" gh project item-add 15 \
            --owner marcusjacobson --url "$URL" >/dev/null

          {
            echo ""
            echo "## Maturity Scout — github-docs"
            echo ""
            echo "Filed: 1"
            echo "  - $URL — $TITLE"
          } >> "$GITHUB_STEP_SUMMARY"

          NEW_TOTAL=$((FILED_SO_FAR+1))
          echo "filed_total=$NEW_TOTAL" >> "$GITHUB_OUTPUT"

      - name: Run WCAG static a11y checks and file gap issues
        id: scan_wcag
        shell: bash
        run: |
          set -euo pipefail

          MAX="${MAX_FILED}"
          FILED_SO_FAR="${{ steps.scan_github_docs.outputs.filed_total }}"
          # Fall back to the repo-hygiene tally if the github-docs step
          # exited before writing filed_total (defensive — every exit
          # path now writes it).
          if [[ -z "$FILED_SO_FAR" ]]; then
            FILED_SO_FAR="${{ steps.scan.outputs.filed }}"
          fi
          FILED_SO_FAR="${FILED_SO_FAR:-0}"

          if [[ "$FILED_SO_FAR" -ge "$MAX" ]]; then
            echo "Hit MAX ($MAX) in earlier steps; skipping WCAG scan."
            {
              echo ""
              echo "## Maturity Scout — WCAG checks"
              echo ""
              echo "Skipped: MAX cap of $MAX reached by earlier steps."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---- Scope: top-level *.html only (the six portfolio pages).
          # Glob with for ... so the scan stays shell-only and does not
          # recurse into staging-inbox/ or playwright-report/.
          shopt -s nullglob
          PAGES=()
          for f in *.html; do
            PAGES+=("$f")
          done
          shopt -u nullglob

          if [[ "${#PAGES[@]}" -eq 0 ]]; then
            echo "No top-level *.html pages found; skipping WCAG scan."
            {
              echo ""
              echo "## Maturity Scout — WCAG checks"
              echo ""
              echo "Skipped: no top-level portfolio pages."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---- Rule 1: html-has-lang (WCAG 3.1.1)
          # Trigger: <html tag without a lang= attribute on the same
          # line, OR the file has no <html tag at all. htmlhint's
          # configured rules in .htmlhintrc do not enforce this.
          R1_FINDINGS=""
          R1_COUNT=0
          for f in "${PAGES[@]}"; do
            HTML_LINE=$(grep -n -i -m1 '<html' "$f" || true)
            if [[ -z "$HTML_LINE" ]]; then
              R1_FINDINGS+=$'- `'"$f"$'` — no `<html>` tag found in document.\n'
              R1_COUNT=$((R1_COUNT+1))
              continue
            fi
            # Check the matched line for lang= attribute.
            if ! echo "$HTML_LINE" | grep -qE 'lang[[:space:]]*='; then
              SNIPPET=$(echo "$HTML_LINE" | sed -E 's/^[0-9]+://; s/^[[:space:]]+//; s/[[:space:]]+$//')
              R1_FINDINGS+=$'- `'"$f"$'` — `'"$SNIPPET"$'`\n'
              R1_COUNT=$((R1_COUNT+1))
            fi
          done

          # ---- Rule 2: link-name (WCAG 4.1.2)
          # Trigger: <a ...></a> with empty text, OR <a ...><svg|img></a>
          # where the inner element has neither alt= nor aria-label=.
          # htmlhint does not check link text content.
          R2_FINDINGS=""
          R2_COUNT=0
          for f in "${PAGES[@]}"; do
            FILE_HITS=0
            FIRST_HIT=""
            # Empty link: <a ...></a> with only whitespace inside.
            while IFS= read -r hit; do
              [[ -z "$hit" ]] && continue
              FILE_HITS=$((FILE_HITS+1))
              if [[ -z "$FIRST_HIT" ]]; then
                FIRST_HIT=$(echo "$hit" | sed -E 's/^[0-9]+://; s/^[[:space:]]+//; s/[[:space:]]+$//')
              fi
            done < <(grep -nE '<a[[:space:]][^>]*>[[:space:]]*</a>' "$f" || true)
            # Icon-only link without alt/aria-label.
            while IFS= read -r hit; do
              [[ -z "$hit" ]] && continue
              # Strip line-number prefix.
              LINE_BODY="${hit#*:}"
              # If the inner svg/img tag has alt= or aria-label=, skip.
              INNER=$(echo "$LINE_BODY" | grep -oE '<(svg|img)[^>]*>' | head -n1 || true)
              if [[ -z "$INNER" ]]; then
                continue
              fi
              if echo "$INNER" | grep -qE '(alt[[:space:]]*=|aria-label[[:space:]]*=)'; then
                continue
              fi
              FILE_HITS=$((FILE_HITS+1))
              if [[ -z "$FIRST_HIT" ]]; then
                FIRST_HIT=$(echo "$hit" | sed -E 's/^[0-9]+://; s/^[[:space:]]+//; s/[[:space:]]+$//')
              fi
            done < <(grep -nE '<a[[:space:]][^>]*>[[:space:]]*<(svg|img)[^>]*>[[:space:]]*</a>' "$f" || true)
            if [[ "$FILE_HITS" -gt 0 ]]; then
              R2_FINDINGS+=$'- `'"$f"$'` — '"$FILE_HITS"$' empty-or-unlabeled link(s); first: `'"$FIRST_HIT"$'`\n'
              R2_COUNT=$((R2_COUNT+1))
            fi
          done

          # ---- Rule 3: heading-order (WCAG 1.3.1)
          # Extract heading levels in document order; flag any forward
          # jump > 1 (h1 -> h3 is bad; h3 -> h1 is OK).
          # htmlhint does not check heading hierarchy.
          R3_FINDINGS=""
          R3_COUNT=0
          for f in "${PAGES[@]}"; do
            # Sequence of heading levels as a space-separated list.
            LEVELS=$(grep -oiE '<h[1-6][^>]*>' "$f" | sed -E 's/^<h([1-6]).*/\1/' | tr '\n' ' ')
            PREV=0
            FIRST_SKIP=""
            SKIP_COUNT=0
            for lvl in $LEVELS; do
              if [[ "$PREV" -gt 0 && "$lvl" -gt "$PREV" ]]; then
                DIFF=$((lvl-PREV))
                if [[ "$DIFF" -gt 1 ]]; then
                  SKIP_COUNT=$((SKIP_COUNT+1))
                  if [[ -z "$FIRST_SKIP" ]]; then
                    FIRST_SKIP="h${PREV} -> h${lvl}"
                  fi
                fi
              fi
              PREV="$lvl"
            done
            if [[ "$SKIP_COUNT" -gt 0 ]]; then
              R3_FINDINGS+=$'- `'"$f"$'` — '"$SKIP_COUNT"$' forward heading skip(s); first: `'"$FIRST_SKIP"$'`\n'
              R3_COUNT=$((R3_COUNT+1))
            fi
          done

          # ---- Render + file: one consolidated issue per rule that has
          # findings. Each rule honours the shared MAX cap.
          FILED=0
          SUPPRESSED=0
          SUMMARY_FILED=""
          SUMMARY_SUPPRESSED=""
          SUMMARY_CLEAN=""

          file_rule () {
            local rule="$1"
            local title="$2"
            local count="$3"
            local findings="$4"

            if [[ "$count" -eq 0 ]]; then
              SUMMARY_CLEAN+=$'\n  - '"$rule"$': clean'
              return 0
            fi

            if [[ $((FILED_SO_FAR + FILED)) -ge "$MAX" ]]; then
              echo "Hit MAX ($MAX); skipping rule $rule."
              SUMMARY_SUPPRESSED+=$'\n  - '"$rule"$' — skipped (MAX cap reached)'
              SUPPRESSED=$((SUPPRESSED+1))
              return 0
            fi

            # Dedupe: any open issue with this exact title and source:wcag?
            local existing match
            existing=$(gh issue list \
              --state open \
              --search "in:title \"$title\" label:source:wcag" \
              --json number,title,url \
              --limit 5)
            match=$(echo "$existing" | jq -r --arg t "$title" \
              '[.[] | select(.title == $t)] | .[0] // empty | "\(.number)|\(.url)"')
            if [[ -n "$match" ]]; then
              echo "Dedup suppressed ($rule): existing open issue $match"
              SUMMARY_SUPPRESSED+=$'\n  - '"$rule"$' — overlaps with '"$match"
              SUPPRESSED=$((SUPPRESSED+1))
              return 0
            fi

            # Render body from template (parameter expansion only — no
            # heredoc inside the YAML block scalar; see issue #115).
            local template body_file
            template=$(cat .github/workflows/templates/wcag-issue-body.md)
            template="${template//__RULE__/$rule}"
            template="${template//__COUNT__/$count}"
            local trimmed="${findings%$'\n'}"
            template="${template//__FINDINGS__/$trimmed}"
            body_file=$(mktemp)
            printf '%s\n' "$template" > "$body_file"

            echo "Filing ($rule): $title"
            local url
            url=$(gh issue create \
              --title "$title" \
              --label "needs-triage,source:wcag,area:html" \
              --body-file "$body_file")
            rm -f "$body_file"

            # Attach to board #15 inline (see issue #133).
            GH_TOKEN="$PROJECT_TOKEN" gh project item-add 15 \
              --owner marcusjacobson --url "$url" >/dev/null

            FILED=$((FILED+1))
            SUMMARY_FILED+=$'\n  - '"$url"$' — '"$title"
          }

          file_rule "html-has-lang" "Add lang attribute to <html> on portfolio pages" "$R1_COUNT" "$R1_FINDINGS"
          file_rule "link-name" "Fix empty or unlabeled links on portfolio pages" "$R2_COUNT" "$R2_FINDINGS"
          file_rule "heading-order" "Fix heading-level skips on portfolio pages" "$R3_COUNT" "$R3_FINDINGS"

          {
            echo ""
            echo "## Maturity Scout — WCAG checks"
            echo ""
            echo "Filed: $FILED"
            if [[ -n "$SUMMARY_FILED" ]]; then echo "$SUMMARY_FILED"; fi
            echo ""
            echo "Suppressed: $SUPPRESSED"
            if [[ -n "$SUMMARY_SUPPRESSED" ]]; then echo "$SUMMARY_SUPPRESSED"; fi
            if [[ -n "$SUMMARY_CLEAN" ]]; then
              echo ""
              echo "Clean rules:"
              echo "$SUMMARY_CLEAN"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Note: filed issues are attached to board #15 inline within each
      # scan step using BUG_PROJECT_TOKEN (see issue #133). Issues created
      # via the default GITHUB_TOKEN do not trigger downstream workflows,
      # so the sibling `maturity-autoadd.yml` cannot reliably attach them.
      # The autoadd workflow remains as a fallback for `source:*` issues
      # filed manually or by other automation.
