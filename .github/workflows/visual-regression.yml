name: Visual Regression

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate visual baselines and upload them as the visual-baselines artifact'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Update visual baselines
        if: ${{ inputs.update_snapshots }}
        run: npm run test:visual:update

      - name: Upload regenerated baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: tests/visual/__snapshots__/
          retention-days: 14

      - name: Run visual tests
        id: visual
        if: ${{ ! inputs.update_snapshots }}
        # Option B: advisory until Linux baselines are committed.
        # Generate baselines via:
        #   docker run --rm -v ${PWD}:/work -w /work mcr.microsoft.com/playwright:v1.48.0-jammy \
        #     bash -c "npm ci && npx playwright test --update-snapshots"
        # then commit tests/visual/__snapshots__/ and remove this continue-on-error.
        continue-on-error: true
        run: npm run test:visual

      - name: Upload diff report
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Comment on PR with failure note
        if: steps.visual.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- visual-regression-comment -->';
            const body = `${marker}\n**Visual regression failed.** Download the \`playwright-report\` artifact from this run for diff PNGs.\n\nIf the change is intentional, run \`npm run test:visual:update\` locally and commit the new baselines under \`tests/visual/__snapshots__/\`.`;
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: pr });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
