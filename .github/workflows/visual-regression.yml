name: Visual Regression

# Runs on every PR so the `playwright` check is always reported and can be a
# required, merge-blocking context. PRs that touch no visual-relevant files
# fast-exit (the expensive steps skip) and the job still reports SUCCESS, so
# requiring this context never deadlocks docs-only / config-only PRs.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate visual baselines and upload them as the visual-baselines artifact'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the change-detection step can diff against the PR base.
          fetch-depth: 0

      - name: Detect visual-relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Non-PR events (workflow_dispatch) always run the full suite.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event: treating as relevant."
            exit 0
          fi
          # Match the path globs this workflow used to filter on.
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files vs base:"
          printf '%s\n' "$files"
          relevant=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.html|*.css|*.js|tests/*|package.json|.github/workflows/visual-regression.yml)
                relevant=true
                break
                ;;
            esac
          done <<< "$files"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Visual-relevant changes: $relevant"

      - name: Setup Node
        if: ${{ steps.changes.outputs.relevant == 'true' || inputs.update_snapshots }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ steps.changes.outputs.relevant == 'true' || inputs.update_snapshots }}
        run: npm ci

      - name: Install Playwright browsers
        if: ${{ steps.changes.outputs.relevant == 'true' || inputs.update_snapshots }}
        # desktop project uses chromium; mobile/tablet emulate iPhone/iPad (webkit).
        run: npx playwright install --with-deps chromium webkit

      - name: Update visual baselines
        if: ${{ inputs.update_snapshots }}
        run: npm run test:visual:update

      - name: Upload regenerated baselines
        # Upload even if the update step exits non-zero: Playwright reports a
        # non-zero status when it writes first-time baselines, but the PNGs are
        # still produced and are what we want to capture.
        if: ${{ always() && inputs.update_snapshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: tests/visual/__snapshots__/
          retention-days: 14

      - name: Run visual tests
        id: visual
        if: ${{ steps.changes.outputs.relevant == 'true' && ! inputs.update_snapshots }}
        # Required gate: a visual diff fails the check. To refresh baselines after
        # an intentional change, dispatch this workflow with update_snapshots=true
        # and commit the visual-baselines artifact.
        run: npm run test:visual

      - name: Upload diff report
        # always() so this still runs after the now-failing visual step.
        if: ${{ always() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Comment on PR with failure note
        if: ${{ always() && steps.visual.outcome == 'failure' && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- visual-regression-comment -->';
            const body = `${marker}\n**Visual regression failed.** Download the \`playwright-report\` artifact from this run for diff PNGs.\n\nIf the change is intentional, run \`npm run test:visual:update\` locally and commit the new baselines under \`tests/visual/__snapshots__/\`.`;
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: pr });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
