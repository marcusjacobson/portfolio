name: Visual Regression

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    # Option B: visual regression is advisory until Linux baselines are committed.
    # Generate baselines via `docker run --rm -v ${PWD}:/work -w /work mcr.microsoft.com/playwright:v1.48.0-jammy bash -c "npm ci && npx playwright test --update-snapshots"`,
    # commit `tests/visual/__snapshots__/`, then remove this `continue-on-error` flag.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual tests
        run: npm run test:visual

      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Comment on PR with failure note
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- visual-regression-comment -->';
            const body = `${marker}\n**Visual regression failed.** Download the \`playwright-report\` artifact from this run for diff PNGs.\n\nIf the change is intentional, run \`npm run test:visual:update\` locally and commit the new baselines under \`tests/visual/__snapshots__/\`.`;
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: pr });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
